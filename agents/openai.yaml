interface:
  display_name: "UIUX Design System"
  short_description: "Turn product briefs into usable UI systems"
  default_prompt: "Use $uiux-design-system in hybrid finalization mode. First run scripts/generate.py to create generation-bundle.json and manifest.json. If the bundle needs correction, update the bundle inputs and rerun the scripts rather than editing final artifacts directly. Then run scripts/render_artifacts.py on that exact artifacts run directory so DESIGN.md and design-spec.html are script-rendered from the same generation bundle into manifest.json.final_output_dir. Do not manually patch DESIGN.md or design-spec.html. After that, run scripts/finalize_manifest.py on the run directory so the manifest records the spec artifacts as verified. Only after DESIGN.md is finalized may the LLM author app-preview.html, using the product requirements and DESIGN.md as the direct source of truth for the preview. Do not write final files to demo/, the repository root, or a different artifacts directory. For design-spec.html, keep the canonical template structure and treat the output as valid only if it preserves the required template signature instead of replacing it with a custom app mockup."
