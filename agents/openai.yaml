interface:
  display_name: "UIUX Design System"
  short_description: "Turn product briefs into usable UI systems"
  default_prompt: "Use $uiux-design-system to turn this product brief into a design system. First run scripts/generate.py to create generation-bundle.json and manifest.json. Then read that bundle and author the final DESIGN.md and design-spec.html in the exact same artifacts run directory recorded by manifest.json.final_output_dir. Do not write final files to demo/, the repository root, or a different artifacts directory. After writing both files, run scripts/finalize_manifest.py on that run directory so the manifest records the run as complete. For design-spec.html, keep the canonical template structure and treat the output as valid only if it preserves the required template signature instead of replacing it with a custom app mockup."
